<div class="viewer-backdrop" role="presentation" (click)="closeViewer()">
  <section
    class="viewer"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="video().title"
    (click)="$event.stopPropagation()"
  >
    <button
      class="viewer-nav viewer-nav-previous"
      type="button"
      aria-label="Previous video"
      [disabled]="!canGoPrevious()"
      (click)="navigate('previous')"
    >
      ‹
    </button>
    <button class="viewer-close" type="button" aria-label="Close viewer" (click)="closeViewer()">
      ×
    </button>
    <div class="viewer-media">
      <video
        #viewerVideo
        [src]="video().url"
        controls
        autoplay
        playsinline
        (loadedmetadata)="startAtOneSecond($event)"
        (loadeddata)="finishMediaLoad()"
      ></video>
      @if (mediaLoading()) {
        <div class="viewer-media-loading" aria-hidden="true"></div>
      }
    </div>
    <div class="viewer-details">
      <div>
        <span class="section-kicker">{{ dateLabel() }}</span>
        <h2>{{ video().title }}</h2>
      </div>
      @if (keywordList().length) {
        <div class="viewer-keywords">
          <span class="section-kicker">Keywords</span>
          <ul>
            <li>{{ keywordList().join(', ') }}</li>
          </ul>
        </div>
      }
    </div>
    <button
      class="viewer-nav viewer-nav-next"
      type="button"
      aria-label="Next video"
      [disabled]="!canGoNext()"
      (click)="navigate('next')"
    >
      ›
    </button>
  </section>
</div>
