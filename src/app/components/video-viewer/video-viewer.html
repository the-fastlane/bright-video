<div class="viewer-backdrop" role="presentation" (click)="closeViewer()">
  <section
    class="viewer"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="video().title"
    (click)="$event.stopPropagation()"
  >
    <button
      class="viewer-nav viewer-nav-previous"
      type="button"
      aria-label="Previous video"
      [disabled]="!canGoPrevious()"
      (click)="navigate('previous')"
    >
      ‹
    </button>
    <button class="viewer-close" type="button" aria-label="Close viewer" (click)="closeViewer()">
      ×
    </button>
    <video #viewerVideo [src]="video().url" controls autoplay playsinline></video>
    <div class="viewer-details">
      <div>
        <span class="section-kicker">{{ dateLabel() }}</span>
        <h2>{{ video().title }}</h2>
      </div>
    </div>
    <button
      class="viewer-nav viewer-nav-next"
      type="button"
      aria-label="Next video"
      [disabled]="!canGoNext()"
      (click)="navigate('next')"
    >
      ›
    </button>
  </section>
</div>
