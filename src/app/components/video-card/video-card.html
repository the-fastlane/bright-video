<article
  class="video-card"
  [style.--video-aspect-ratio]="aspectRatio()"
  (click)="open.emit(video())"
  (keydown.enter)="open.emit(video())"
  tabindex="0"
>
  <div
    #mediaFrame
    class="media-frame"
    [style.aspect-ratio]="aspectRatio()"
    [attr.data-video-id]="video().id"
    (mouseenter)="emitPreviewStart()"
    (mouseleave)="emitPreviewStop()"
  >
    @if (video().thumbnailUrl && !thumbnailUnavailable()) {
      <img
        [class.preview-active]="previewActive()"
        [class.preview-playing]="previewPlaying()"
        [src]="video().thumbnailUrl"
        [alt]="video().title"
        (error)="handleThumbnailError()"
      />
    }
    <video
      [attr.src]="
        previewActive() ||
        (previewFrameVisible() && !previewStopped()) ||
        ((!video().thumbnailUrl || thumbnailUnavailable()) && loaded() && !previewStopped())
          ? video().url
          : null
      "
      [attr.poster]="video().thumbnailUrl"
      [class.preview-active]="
        previewActive() || ((!video().thumbnailUrl || thumbnailUnavailable()) && loaded())
      "
      [class.preview-playing]="previewPlaying()"
      [class.preview-frame-visible]="previewFrameVisible()"
      [class.preview-stopped]="previewStopped()"
      [attr.preload]="previewActive() ? 'metadata' : 'none'"
      loop
      playsinline
      muted
      disableremoteplayback
      disablepictureinpicture
      (loadstart)="logMediaEvent($event)"
      (loadedmetadata)="handleLoadedMetadata($event)"
      (playing)="handlePlaying($event)"
      (emptied)="handleEmptied()"
      (progress)="logMediaEvent($event)"
      (canplay)="logMediaEvent($event)"
      (stalled)="logMediaEvent($event)"
      (suspend)="logMediaEvent($event)"
      (abort)="logMediaEvent($event)"
      (error)="logMediaEvent($event)"
    ></video>
    <div class="media-shade"></div>
    <div class="album-add-control" [class.open]="menuOpen()" (click)="stopCardClick($event)">
      <button
        class="album-add-button"
        type="button"
        aria-label="Add video to an album"
        title="Add to album"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleAlbumMenu($event)"
      >
        <span aria-hidden="true">+</span>
      </button>
      <div class="album-add-menu" role="menu">
        <button type="button" role="menuitem" (click)="addToExistingAlbum.emit(video())">
          Add to existing album
        </button>
        <button type="button" role="menuitem" (click)="createAlbum.emit(video())">
          Create new album
        </button>
      </div>
    </div>
    @if (duration()) {
      <span class="duration-badge" [class.loading]="previewLoading()">{{ duration() }}</span>
    }
  </div>
</article>
